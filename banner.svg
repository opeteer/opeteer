<svg viewBox="0 0 900 240" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter Neon Glow -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Fisik Titik LED Matriks -->
    <pattern id="led-matrix-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#151d28" />
    </pattern>

    <style>
      @keyframes neonFlicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% {
          opacity: 1;
          filter: drop-shadow(0 0 4px #00ffcc) drop-shadow(0 0 14px #00e5ff) drop-shadow(0 0 28px #0077ff);
        }
        19%, 24%, 54% {
          opacity: 0.25;
          filter: none;
        }
      }

      @keyframes signBorderGlow {
        0%, 100% { stroke: #ff0055; filter: drop-shadow(0 0 5px #ff0055); }
        50% { stroke: #ffaa00; filter: drop-shadow(0 0 8px #ffaa00); }
      }

      @keyframes hazardFlash {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #ffb700); }
        50% { opacity: 0.2; filter: none; }
      }

      .sign-border {
        stroke-dasharray: 8 6;
        animation: signBorderGlow 3s infinite ease-in-out;
      }

      .led-text {
        font-family: 'Courier New', monospace, Impact;
        font-size: 86px;
        font-weight: 900;
        letter-spacing: 12px;
        fill: #e6ffff;
        stroke: #00ffcc;
        stroke-width: 3px;
        stroke-dasharray: 4 6;
        stroke-linecap: round;
        animation: neonFlicker 3.8s infinite;
      }

      .sub-bar {
        font-family: monospace;
        font-size: 13px;
        letter-spacing: 5px;
        fill: #ffe600;
        filter: drop-shadow(0 0 3px #ffcc00);
      }

      .hazard-light {
        animation: hazardFlash 1.2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Papan Casing Rambu Jalan -->
  <rect x="15" y="15" width="870" height="210" rx="18" fill="#080b11" stroke="#222f3e" stroke-width="6"/>
  <!-- Matriks Titik LED -->
  <rect x="25" y="25" width="850" height="190" rx="12" fill="#0b0f19"/>
  <rect x="25" y="25" width="850" height="190" rx="12" fill="url(#led-matrix-dots)"/>

  <!-- Lampu Indikator Amber Rambu -->
  <circle cx="55" cy="50" r="6" fill="#ffb700" class="hazard-light"/>
  <circle cx="845" cy="50" r="6" fill="#ffb700" class="hazard-light"/>

  <!-- Border Neon Berkedip -->
  <rect x="35" y="35" width="830" height="170" rx="10" fill="none" class="sign-border" stroke-width="3.5"/>

  <!-- Banner LED OPETEER -->
  <text x="50%" y="135" text-anchor="middle" class="led-text">OPETEER</text>

  <!-- Sub-teks Highway Sign -->
  <text x="50%" y="175" text-anchor="middle" class="sub-bar">● TRAFFIC: ACTIVE // SYSTEM: ONLINE ●</text>
</svg>
