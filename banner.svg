<svg viewBox="0 0 520 620" width="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Efek Glow Lembut khas Poster Aerospace -->
    <filter id="wormGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Style Vektor -->
    <style>
      .nasa-worm-text {
        font-family: 'Nasarna', 'Arial Rounded MT Bold', 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-size: 88px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
        letter-spacing: 24px;
        filter: url(#wormGlow);
      }

      .bracket-line {
        stroke: #334155;
        stroke-width: 2;
        fill: none;
      }

      .hud-sub {
        font-family: monospace;
        font-size: 11px;
        fill: #64748b;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Latar Belakang Deep Space Minimalis -->
  <rect width="520" height="620" rx="16" fill="#06090e" stroke="#1e293b" stroke-width="2"/>

  <!-- Garis Pemisah Vertikal Taktikal -->
  <line x1="170" y1="35" x2="170" y2="585" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ================= KIRI: TEKS OPETEER VERTIKAL (NASA WORM STYLE) ================= -->
  <!-- Teks dirotasi -90 derajat (dibaca dari bawah ke atas persis seperti roket NASA) -->
  <g transform="translate(110, 560) rotate(-90)">
    <text x="0" y="0" class="nasa-worm-text">OPETEER</text>
  </g>

  <!-- Indikator sudut koordinat -->
  <text x="35" y="45" class="hud-sub">SYS // 01</text>
  <text x="35" y="590" class="hud-sub">STAGE: V</text>

  <!-- ================= KANAN: TECH STACK BADGES MENUMPUK VERTIKAL ================= -->
  <!-- Header Stack -->
  <text x="210" y="45" class="hud-sub">PROPULSION // TECH STACK</text>
  <line x1="210" y1="55" x2="480" y2="55" stroke="#334155" stroke-width="1.5"/>

  <!-- Badge 1: JAVA -->
  <g transform="translate(210, 75)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#ED8B00" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#ED8B00"/>
    <image href="https://cdn.simpleicons.org/openjdk/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">JAVA</text>
  </g>

  <!-- Badge 2: POSTGRESQL -->
  <g transform="translate(210, 130)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#4169E1" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#4169E1"/>
    <image href="https://cdn.simpleicons.org/postgresql/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">POSTGRESQL</text>
  </g>

  <!-- Badge 3: LARAVEL -->
  <g transform="translate(210, 185)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#FF2D20" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#FF2D20"/>
    <image href="https://cdn.simpleicons.org/laravel/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">LARAVEL</text>
  </g>

  <!-- Badge 4: PYTHON -->
  <g transform="translate(210, 240)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#3776AB" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#3776AB"/>
    <image href="https://cdn.simpleicons.org/python/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">PYTHON</text>
  </g>

  <!-- Badge 5: DJANGO -->
  <g transform="translate(210, 295)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#092E20" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#092E20"/>
    <image href="https://cdn.simpleicons.org/django/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">DJANGO</text>
  </g>

  <!-- Badge 6: C++ -->
  <g transform="translate(210, 350)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#00599C" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#00599C"/>
    <image href="https://cdn.simpleicons.org/cplusplus/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">C++</text>
  </g>

  <!-- Badge 7: PHP -->
  <g transform="translate(210, 405)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#777BB4" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#777BB4"/>
    <image href="https://cdn.simpleicons.org/php/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">PHP</text>
  </g>

  <!-- Badge 8: GO -->
  <g transform="translate(210, 460)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#00ADD8" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#00ADD8"/>
    <image href="https://cdn.simpleicons.org/go/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">GO</text>
  </g>

  <!-- Badge 9: SQLITE -->
  <g transform="translate(210, 515)">
    <rect width="270" height="42" rx="7" fill="#111622" stroke="#003B57" stroke-width="2"/>
    <rect width="45" height="42" rx="7" fill="#003B57"/>
    <image href="https://cdn.simpleicons.org/sqlite/white" x="12" y="11" width="20" height="20"/>
    <text x="65" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">SQLITE</text>
  </g>
</svg>
