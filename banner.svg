<svg viewBox="0 0 540 816" width="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Khas NASA Worm Logo -->
    <filter id="wormGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .nasa-worm-text {
        font-family: 'Nasarna', 'Arial Rounded MT Bold', 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
        letter-spacing: 12px;
        filter: url(#wormGlow);
      }

      .hud-sub {
        font-family: monospace;
        font-size: 11px;
        fill: #64748b;
        letter-spacing: 3px;
      }

      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 13.5px;
        fill: #ffffff;
        letter-spacing: 2px;
      }

      .badge-index {
        font-family: monospace;
        font-weight: 700;
        font-size: 11px;
        fill: #ffffff;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Latar Belakang Deep Space -->
  <rect width="540" height="816" rx="16" fill="#06090e" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Garis Pemisah Vertikal Taktikal -->
  <line x1="175" y1="35" x2="175" y2="781" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Indikator HUD Kiri -->
  <text x="35" y="48" class="hud-sub">SYS // 01</text>
  <text x="35" y="781" class="hud-sub">STAGE: V</text>

  <!-- ================= KIRI: OPETEER (VERTIKAL ALA NASA WORM) ================= -->
  <g transform="translate(105, 408) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" class="nasa-worm-text">OPETEER</text>
  </g>

  <!-- ================= KANAN: TECH STACK BADGES MENUMPUK ================= -->
  <text x="210" y="48" class="hud-sub">PROPULSION // TECH STACK</text>
  <line x1="210" y1="58" x2="495" y2="58" stroke="#334155" stroke-width="1.5"/>

  <!-- 1. JAVA -->
  <g transform="translate(210, 75)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#ED8B00" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#ED8B00"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">01</text>
    <text x="66" y="27" class="badge-label">JAVA</text>
  </g>

  <!-- 2. POSTGRESQL -->
  <g transform="translate(210, 131)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#4169E1" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#4169E1"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">02</text>
    <text x="66" y="27" class="badge-label">POSTGRESQL</text>
  </g>

  <!-- 3. LARAVEL -->
  <g transform="translate(210, 187)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#FF2D20" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#FF2D20"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">03</text>
    <text x="66" y="27" class="badge-label">LARAVEL</text>
  </g>

  <!-- 4. PYTHON -->
  <g transform="translate(210, 243)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#3776AB" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#3776AB"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">04</text>
    <text x="66" y="27" class="badge-label">PYTHON</text>
  </g>

  <!-- 5. DJANGO -->
  <g transform="translate(210, 299)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#092E20" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#092E20"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">05</text>
    <text x="66" y="27" class="badge-label">DJANGO</text>
  </g>

  <!-- 6. C++ -->
  <g transform="translate(210, 355)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#00599C" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#00599C"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">06</text>
    <text x="66" y="27" class="badge-label">C++</text>
  </g>

  <!-- 7. PHP -->
  <g transform="translate(210, 411)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#777BB4" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#777BB4"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">07</text>
    <text x="66" y="27" class="badge-label">PHP</text>
  </g>

  <!-- 8. GO -->
  <g transform="translate(210, 467)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#00ADD8" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#00ADD8"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">08</text>
    <text x="66" y="27" class="badge-label">GO</text>
  </g>

  <!-- 9. SQLITE -->
  <g transform="translate(210, 523)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#003B57" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#003B57"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">09</text>
    <text x="66" y="27" class="badge-label">SQLITE</text>
  </g>

  <!-- 10. DOCKER -->
  <g transform="translate(210, 579)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#2496ED" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#2496ED"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">10</text>
    <text x="66" y="27" class="badge-label">DOCKER</text>
  </g>

  <!-- 11. KUBERNETES -->
  <g transform="translate(210, 635)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#326CE5" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#326CE5"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">11</text>
    <text x="66" y="27" class="badge-label">KUBERNETES</text>
  </g>

  <!-- 12. LINUX -->
  <g transform="translate(210, 691)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#FCC624" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#FCC624"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index" fill="#101726">12</text>
    <text x="66" y="27" class="badge-label">LINUX</text>
  </g>

  <!-- 13. FEDORA -->
  <g transform="translate(210, 747)">
    <rect width="285" height="42" rx="7" fill="#101726" stroke="#294172" stroke-width="2"/>
    <rect width="46" height="42" rx="7" fill="#294172"/>
    <text x="23" y="26" text-anchor="middle" class="badge-index">13</text>
    <text x="66" y="27" class="badge-label">FEDORA</text>
  </g>
</svg>
